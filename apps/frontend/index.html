<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JuryCrowd — run AI coding agents side-by-side in resizable terminal panels." />
    <title>JuryCrowd</title>
    <script>
      // Apply saved theme before render to avoid flash.
      // Cream canvas is the default floor (DESIGN.md); dark is opt-in.
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
